name: release

# VERSION is the version to PUBLISH, declared in the commit that changes the
# library. CI never invents a number.
#
# The workflow used to run `bump :level :patch` and publish the result, which
# made VERSION mean "the last released version" and made a minor or major
# release unreachable: 0.4.0 could not be published at any value of the file.
# It also meant a consumer could not pin a coordinate before the release,
# because the number in the file was never the number that would exist.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'deps.edn'
      - 'VERSION'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest

      # A payment library does not publish an unmeasured jar. The suite
      # instruments every contract and walks src/ to load every namespace, so
      # this also catches a namespace that cannot load at all.
      #
      # ^:integration is excluded by the :test alias itself: those probe real
      # daemons from docker-compose.integration.yml and are not CI's job.
      - name: Test
        run: clojure -M:test

      # BOTH secrets are checked. Testing only the username lets a repo with a
      # username and no token reach the deploy step and fail there, having
      # already claimed the version number in the log.
      - name: Can we publish?
        id: creds
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_DEPLOY_TOKEN }}
        run: |
          if [ -n "$CLOJARS_USERNAME" ] && [ -n "$CLOJARS_PASSWORD" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOJARS_USERNAME or CLOJARS_DEPLOY_TOKEN is unset — tested, not released."
          fi

      # A Maven coordinate is immutable, so a version already on the registry
      # cannot be republished. Skipping is the CORRECT outcome and not a
      # failure: it is exactly what a test-only or dependency-only push should
      # do. This is what lets deps.edn stay in the path filter above without
      # minting a release whose src/ is byte-identical to the last one.
      #
      # The coordinate is read from version.edn rather than written out here,
      # so the group and artifact are declared once.
      - name: Is this version already released?
        id: version
        run: |
          VER=$(cat VERSION)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          PATH_SEG=$(clojure -M -e '(let [lib (:lib (read-string (slurp "version.edn")))] (print (str (clojure.string/replace (namespace lib) "." "/") "/" (name lib))))')
          ART=$(basename "$PATH_SEG")
          URL="https://repo.clojars.org/$PATH_SEG/$VER/$ART-$VER.pom"
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' "$URL")
          echo "checked $URL -> $CODE"
          if [ "$CODE" = "200" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$VER is already on Clojars — tested, not republished. Edit VERSION to release."
          elif [ "$CODE" = "404" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Clojars answered $CODE for $URL — refusing to guess whether $VER exists."
            exit 1
          fi

      - name: Deploy
        if: steps.creds.outputs.ok == 'true' && steps.version.outputs.new == 'true'
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_DEPLOY_TOKEN }}
        run: clojure -T:build deploy

      # Only now, with the artifact actually on the registry, does the tag mean
      # what it says. Nothing is committed here: VERSION arrived with the
      # commit that changed the library, so there is no push to race and no
      # [skip ci] to remember.
      - name: Tag
        if: steps.creds.outputs.ok == 'true' && steps.version.outputs.new == 'true'
        run: |
          VER=${{ steps.version.outputs.ver }}
          git config user.name  "hive-ci"
          git config user.email "ci@hive-agi.local"
          # Annotated: `git push --follow-tags` ignores lightweight tags.
          git tag -a "v$VER" -m "release $VER"
          git push origin "v$VER"
